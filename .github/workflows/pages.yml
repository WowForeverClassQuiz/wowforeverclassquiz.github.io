# Publishes the static edition of the quiz to GitHub Pages whenever main changes.
#
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; only the newest queued one runs after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # requirements-dev.txt adds numpy, so the large-sample balance checks (every class equally likely) run too.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Nothing is published unless the scoring engines agree and every specialization is still reachable.
      - name: Run the tests
        run: python -m pytest -q

      - name: Build the static site
        run: python tools/build_static.py --out site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
